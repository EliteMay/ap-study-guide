<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<nav class="unit-nav"><div class="container"><span class="unit-nav-label">AP STUDY NOTES</span><ul class="unit-nav-list"><li><a href="../index.html" class="unit-nav-link">🏠 ホーム</a></li><li><a href="practice.html" class="unit-nav-link is-current" aria-current="page">🧪 総合演習</a></li></ul></div></nav>
<header class="practice-hero"><div class="container">
<p class="eyebrow">ORIGINAL AP PRACTICE / 23 MIDDLE CATEGORIES</p>
<h1>総合演習</h1>
<p class="lead">IPA公式過去問の問題文を転載せず、シラバスVer.7.2と本サイトLessonを基に作ったオリジナル問題です。37問でIPA中分類1〜23をすべて横断し、選択式は自動採点、記述式は自分で答えてから模範観点と照合します。</p>
</div></header>
<main>
<section class="section"><div class="container">
<div class="practice-toolbar">
<label>学習ユニット<select id="practice-unit"><option value="all">全ユニット</option></select></label>
<label>問題形式<select id="practice-type"><option value="all">すべて</option><option value="choice">選択式</option><option value="written">記述式</option></select></label>
<label>難易度<select id="practice-difficulty"><option value="all">すべて</option><option value="2">標準</option><option value="3">応用</option><option value="4">やや難</option></select></label>
<label>学習状況<select id="practice-status"><option value="all">すべて</option><option value="unattempted">未挑戦</option><option value="retry">要復習</option><option value="mastered">理解済み</option></select></label>
<button type="button" id="practice-random">条件内からランダム</button>
</div>
<div id="practice-summary" class="practice-summary" aria-live="polite"></div>
<div class="practice-layout">
<aside class="practice-list-panel" aria-label="問題一覧"><div id="practice-list" class="practice-list"></div></aside>
<section id="practice-question" class="practice-question-panel" aria-live="polite"><p class="practice-empty">問題を読み込み中...</p></section>
</div>
</div></section>
</main>
<footer class="site-footer"><div class="container"><p>AP Study Notes</p><p class="small">オリジナル総合演習 · 履歴はこのブラウザに保存</p></div></footer>

<script src="../js/practice.js" defer></script>
</body>
