function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function stripParen(text) {
  return String(text).replace(/（.*?）/g, '').trim();
}

function getQuestionText(term) {
  if (TERM_PROMPTS[term.term]) return TERM_PROMPTS[term.term];
  let text = term.definition;
  const directWords = [term.term, stripParen(term.term), term.term.split(' / ')[0], term.term.split('（')[0]];
  directWords.forEach(w => {
    if (w && w.length >= 2) text = text.replaceAll(w, 'これ');
  });
  return text;
}

function getTermByName(name) {
  return TERMS.find(t => t.term === name);
}

function getDistractorLabels(correct, count = 3) {
  const forced = FORCED_DISTRACTORS[correct.term];
  if (forced && forced.length >= count) return shuffle(forced).slice(0, count);

  const sameCategory = TERMS.filter(t => t.id !== correct.id && t.category === correct.category).map(t => t.term);
  if (sameCategory.length >= count) return shuffle(sameCategory).slice(0, count);

  return shuffle(TERMS.filter(t => t.id !== correct.id).map(t => t.term)).slice(0, count);
}

function makeDefinitionChoiceText(term) {
  return getQuestionText(term);
}

function getDefinitionDistractors(correct, count = 3) {
  const forced = FORCED_DISTRACTORS[correct.term] || [];
  const forcedTerms = forced.map(getTermByName).filter(Boolean);
  if (forcedTerms.length >= count) return shuffle(forcedTerms).slice(0, count);
  const sameCategory = TERMS.filter(t => t.id !== correct.id && t.category === correct.category);
  if (sameCategory.length >= count) return shuffle(sameCategory).slice(0, count);
  return shuffle(TERMS.filter(t => t.id !== correct.id)).slice(0, count);
}

function makeStandardQuestion(term, forcedMode) {
  const mode = forcedMode === 'auto'
    ? (Math.random() < 0.55 ? 'definition-to-term' : 'term-to-definition')
    : forcedMode;

  if (mode === 'term-to-definition') {
    const candidates = [term, ...getDefinitionDistractors(term)];
    const choices = shuffle(candidates).map(item => ({
      label: makeDefinitionChoiceText(item),
      isCorrect: item.id === term.id
    }));
    return {
      type: 'standard',
      category: term.category,
      prompt: `「${escapeHtml(term.term)}」の説明として最も適切なものはどれか。`,
      answerText: term.term,
      choices,
      explain: `${term.term}：${term.definition}`
    };
  }

  const labels = [term.term, ...getDistractorLabels(term)];
  const choices = shuffle(labels).map(label => ({ label, isCorrect: label === term.term }));
  return {
    type: 'standard',
    category: term.category,
    prompt: `次の説明に該当するものとして最も適切なものはどれか。
<span class="small-muted">${escapeHtml(getQuestionText(term))}</span>`,
    answerText: term.term,
    choices,
    explain: `${term.term}：${term.definition}`
  };
}

function makeExamQuestion(q) {
  return {
    type: 'exam',
    category: 'AP本番風',
    prompt: escapeHtml(q.question),
    answerText: q.answer,
    choices: shuffle(q.choices).map(c => ({ label: c, isCorrect: c === q.answer })),
    explain: q.explain
  };
}

function buildQuestions(count, difficulty, mode) {
  if (mode === 'exam-only' || difficulty === 'exam') {
    return shuffle(EXAM_QUESTIONS).slice(0, Math.min(count, EXAM_QUESTIONS.length)).map(makeExamQuestion);
  }
  if (difficulty === 'mixed') {
    const examCount = Math.min(Math.ceil(count * 0.55), EXAM_QUESTIONS.length);
    const standardCount = count - examCount;
    return shuffle([
      ...shuffle(EXAM_QUESTIONS).slice(0, examCount).map(makeExamQuestion),
      ...shuffle(TERMS).slice(0, standardCount).map(t => makeStandardQuestion(t, mode))
    ]);
  }
  return shuffle(TERMS).slice(0, count).map(t => makeStandardQuestion(t, mode));
}

function startTest() {
  const max = questionModeInput.value === 'exam-only' || difficultyModeInput.value === 'exam' ? EXAM_QUESTIONS.length : TERMS.length;
  let count = Number(questionCountInput.value || 10);
  count = Math.max(1, Math.min(max, count));
  questionCountInput.value = count;

  questions = buildQuestions(count, difficultyModeInput.value, questionModeInput.value);
  currentIndex = 0;
  score = 0;
  answered = false;
  review = [];
  resultArea.hidden = true;
  testArea.hidden = false;
  restartBtn.hidden = false;
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[currentIndex];
  questionBox.innerHTML = `
    <div class="question-card">
      <div class="question-meta">
        <span>${currentIndex + 1} / ${questions.length} 問</span>
        <span class="question-tag">${escapeHtml(q.category)}・${q.type === 'exam' ? 'ひっかけ' : '標準'}</span>
      </div>
      <div class="question-title">${q.prompt}</div>
      <div class="option-grid">
        ${q.choices.map((choice, idx) => `
          <button type="button" class="option-btn" data-correct="${choice.isCorrect}">
            ${idx + 1}. ${escapeHtml(choice.label)}
          </button>
        `).join('')}
      </div>
      <div id="test-feedback" class="test-feedback" hidden></div>
      <div class="test-actions">
        <button id="next-question" class="primary-link-btn" type="button" hidden>次へ</button>
      </div>
    </div>
  `;

  questionBox.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => chooseAnswer(btn));
  });
  document.getElementById('next-question').addEventListener('click', goNext);
}

function chooseAnswer(button) {
  if (answered) return;
  answered = true;
  const q = questions[currentIndex];
  const correct = button.dataset.correct === 'true';
  const feedback = document.getElementById('test-feedback');
  const nextBtn = document.getElementById('next-question');
  questionBox.querySelectorAll('.option-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.correct === 'true') btn.classList.add('correct');
  });
  if (correct) {
    score++;
    feedback.innerHTML = `正解。<br>${escapeHtml(q.explain)}`;
  } else {
    button.classList.add('wrong');
    feedback.innerHTML = `不正解。正解は「${escapeHtml(q.answerText)}」。<br>${escapeHtml(q.explain)}`;
  }
  review.push({ prompt: q.prompt.replace(/<[^>]+>/g, ''), answer: q.answerText, correct });
  feedback.hidden = false;
  nextBtn.hidden = false;
  nextBtn.textContent = currentIndex + 1 >= questions.length ? '結果を見る' : '次へ';
}

function goNext() {
  currentIndex++;
  if (currentIndex >= questions.length) finishTest();
  else renderQuestion();
}

function finishTest() {
  testArea.hidden = true;
  const pct = Math.round((score / questions.length) * 100);
  const wrongs = review.filter(r => !r.correct);
  resultArea.hidden = false;
  resultArea.innerHTML = `
    <h2>結果：${score} / ${questions.length} 問 正解（${pct}%）</h2>
    <p class="study-note">間違えた問題だけ下に出します。</p>
    <div class="review-list">
      ${wrongs.length ? wrongs.map(w => `
        <div class="review-item">
          <div><strong>問題：</strong>${escapeHtml(w.prompt)}</div>
          <div><strong>正解：</strong>${escapeHtml(w.answer)}</div>
        </div>
      `).join('') : '<div class="review-item">全問正解です。</div>'}
    </div>
  `;
}

startBtn.addEventListener('click', startTest);
restartBtn.addEventListener('click', startTest);
</script>

</body>
</html>
