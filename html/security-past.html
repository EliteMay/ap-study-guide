<link href="../css/style.css" rel="stylesheet">
<link href="../css/past.css" rel="stylesheet">
<link href="../css/shell.css" rel="stylesheet">
</head>
<body>
<nav class="unit-nav">
  <div class="container">
    <span class="unit-nav-label">AP 単元一覧</span>
    <ul class="unit-nav-list"><li><a href="../index.html" class="unit-nav-link">🏠 ホーム</a></li><li><a href="security-past.html" class="unit-nav-link is-current" aria-current="page">📘 過去問解説</a></li></ul>
  </div>
</nav>
<header class="site-header">
  <div class="container">
    <p class="eyebrow">Security Past Questions</p>
    <h1>情報セキュリティ 過去問解説</h1>
    <p class="lead">問題文JSON・PDF原本・設問別解説・関連用語・構造化Lessonをつなげて、午後問題の読み方を確認します。</p>
    <div class="past-hero-note">解説だけを読むのではなく、「設問が何を聞くか → 問題文のどこを見るか → なぜその答案になるか」の順で確認します。Lessonから開いた場合は対象問題を自動展開します。</div>
  </div>
</header>
<main id="main-content">
  <section class="section">
    <div class="container">
      <h2>過去問一覧</h2>
      <div class="past-control-panel">
        <div class="past-controls">
          <label>検索
            <input id="past-search" type="search" placeholder="年度・テーマ・関連用語で検索（/ キーでも検索へ移動）" autocomplete="off">
          </label>
          <label>年度・期
            <select id="round-filter"><option value="all">すべて</option></select>
          </label>
        </div>
        <div class="past-summary"><span>表示中</span><span id="past-count" class="past-pill">読み込み中...</span></div>
      </div>
      <div id="past-list" class="past-list"><div class="empty-note">過去問データを読み込み中...</div></div>
    </div>
  </section>
</main>
<footer class="site-footer"><div class="container"><p>AP Study Notes</p><p class="small">情報セキュリティ 午後過去問解説</p></div></footer>
<script src="../js/shell.js" defer></script>
<script src="../js/past.js" defer></script>
<script src="../js/past-direct.js" defer></script>
