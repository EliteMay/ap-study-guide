<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>単語辞書 | AP Study Notes</title>
<link href="../css/style.css" rel="stylesheet">
<link href="../css/shell.css" rel="stylesheet">
<link href="../css/glossary.css" rel="stylesheet">
</head>
<body>
<nav class="unit-nav"><div class="container"><span class="unit-nav-label">AP STUDY NOTES</span><ul class="unit-nav-list"><li><a href="../index.html" class="unit-nav-link">🏠 ホーム</a></li></ul></div></nav>
<header class="glossary-hero"><div class="container">
<p class="eyebrow">REFERENCE / LEGACY TERMS</p>
<h1>単語辞書</h1>
<p class="lead">昔のメイン教材だった旧6分野の用語資産を、今は<strong>「分からない語をすぐ調べるための辞書」</strong>として1ページに集約しています。主学習は構造化Lesson、ここは検索・復習・細部確認に使います。</p>
<div class="glossary-search-row"><label class="glossary-search-box"><span>用語を検索</span><input id="glossary-search" type="search" placeholder="例: OAuth / JOIN / VLAN / EVM" autocomplete="off"></label><button id="glossary-clear" type="button" class="glossary-clear">条件をクリア</button></div>
<div class="glossary-controls">
<label>分野<select id="glossary-domain"><option value="">6分野すべて</option></select></label>
<label>カテゴリ<select id="glossary-category"><option value="">すべて</option></select></label>
<label>状態<select id="glossary-status"><option value="">すべて</option><option value="bookmarked">☆ 復習リスト</option><option value="checked">✓ チェック済み</option><option value="unchecked">未チェック</option></select></label>
</div>
<div class="glossary-summary"><strong id="glossary-result-count">読み込み中...</strong><span id="glossary-loaded-note">用語データを準備しています。</span></div>
</div></header>
<main id="main-content">
<section class="glossary-body"><div class="container">
<div id="glossary-domain-stats" class="glossary-domain-stats" aria-label="分野別用語数"></div>
<div id="glossary-results" class="glossary-results"><div class="glossary-loading">用語索引を読み込み中...</div></div>
<div class="glossary-more-wrap"><button id="glossary-more" class="glossary-more" type="button" hidden>さらに表示</button></div>
</div></section>
</main>
<footer class="site-footer"><div class="container"><p>AP Study Notes</p><p class="small">単語辞書は補助資料。主学習はLesson・演習を使用します。</p></div></footer>
<script src="../js/shell.js" defer></script>
<script src="../js/glossary.js" defer></script>
</body>
</html>
