name: Validate AP Study Notes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON and references
        run: node tests/validate.mjs
      - name: Validate system and management audits
        run: node tests/validate-audits.mjs
