<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON品質チェック | AP Study Notes</title><link href="../css/style.css" rel="stylesheet"><style>pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:16px;border-radius:12px}.ok{color:#047857;font-weight:900}.warn{color:#b45309;font-weight:900}</style></head><body><main class="section"><div class="container"><h1>JSON品質チェック</h1><p>Live Serverで開いてください。セキュリティとネットワークの用語ID重複、term重複、details対応、過去問の設問対象漏れ、問題文JSONの有無を検査します。</p><button id="run" class="primary-link-btn">チェック開始</button><pre id="out">待機中</pre></div></main><script>
const log=[];const out=document.getElementById('out');function w(x){log.push(x);out.textContent=log.join('\n')}async function f(p){const r=await fetch('../'+p,{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.json()}function dup(arr,key,label){const m=new Map();for(const x of arr){const v=x[key];if(!v)w('WARN '+label+' missing '+key+': '+JSON.stringify(x).slice(0,80));else if(m.has(v))w('WARN duplicate '+label+' '+key+': '+v);else m.set(v,x)}}async function checkTermSet(prefix,label){w(label+' terms...');const tm=await f(prefix+'-terms-manifest.json');const dm=await f(prefix+'-details-manifest.json');let terms=[];let details=[];for(const item of tm.files){const j=await f(item.file);terms=terms.concat(j.terms||[]);if(Number(item.count||0)!==(j.terms||[]).length)w('WARN '+label+' term count mismatch '+item.file)}for(const item of dm.files){const j=await f(item.file);details=details.concat(j.details||[]);if(Number(item.count||0)!==(j.details||[]).length)w('WARN '+label+' detail count mismatch '+item.file)}w(label+' terms count: '+terms.length);w(label+' details count: '+details.length);dup(terms,'id',label+' term');dup(terms,'term',label+' term');dup(details,'id',label+' detail');const termIds=new Set(terms.map(x=>x.id));const detailIds=new Set(details.map(x=>x.id));for(const id of termIds){if(!detailIds.has(id))w('WARN '+label+' missing detail for '+id)}for(const id of detailIds){if(!termIds.has(id))w('WARN '+label+' detail without term '+id)}const total=Number(tm.meta?.totalTerms||0);if(total&&total!==terms.length)w('WARN '+label+' manifest totalTerms mismatch: '+total+' vs '+terms.length)}document.getElementById('run').onclick=async()=>{log.length=0;try{await checkTermSet('security','security');await checkTermSet('network','network');w('security past...');const pi=await f('security-past-index.json');for(const item of pi.files){w('file '+item.file);const pj=await f(item.file);if(item.problemFile){await f(item.problemFile);w('  problemFile OK: '+item.problemFile)}else w('WARN no problemFile for '+item.id);for(const q of pj.pastQuestions||[]){if(!Array.isArray(q.sections)||!q.sections.length)w('WARN no sections '+q.id);for(const s of q.sections||[]){if(!s.answerTargets||!s.answerTargets.length)w('WARN no targets '+q.id+' '+s.label);if((!s.expectedAnswers||!s.expectedAnswers.length)&&s.status!=='要原本確認')w('WARN no answers '+q.id+' '+s.label);}}}w('DONE');}catch(e){w('ERROR '+e.message);console.error(e)}};</script></body></html>
