<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP Study Notes Data Integrity Tests</title><style>:root{font-family:"Yu Gothic",Meiryo,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{width:min(980px,92%);margin:0 auto;padding:38px 0 64px}h1{margin:0 0 8px}.lead{color:#64748b}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.pill{padding:7px 12px;border-radius:999px;background:#e2e8f0;font-weight:800}.pill.pass{background:#dcfce7;color:#166534}.pill.fail{background:#fee2e2;color:#991b1b}.group{margin:16px 0;padding:18px;background:#fff;border:1px solid #dbe5ee;border-radius:14px}.group h2{margin:0 0 10px;font-size:1.05rem}.case{display:grid;grid-template-columns:68px 1fr;gap:10px;padding:8px 0;border-top:1px solid #edf2f7}.case:first-of-type{border-top:0}.status{font-weight:900}.status.pass{color:#15803d}.status.fail{color:#b91c1c}code{font-family:Consolas,monospace}.actions{display:flex;gap:10px;margin-top:16px}.btn{display:inline-block;border:1px solid #cbd5e1;border-radius:10px;padding:9px 13px;background:#fff;color:#0f172a;text-decoration:none;font-weight:800;cursor:pointer}</style></head>
<body><main class="wrap"><p><a class="btn" href="../index.html">← サイトへ戻る</a></p><h1>Data Integrity Tests</h1><p class="lead">6分野の辞書データ、主要ページ、セキュリティ過去問の対応を自動検査します。</p><div class="actions"><button class="btn" id="rerun" type="button">再実行</button></div><div class="summary" id="summary"><span class="pill">実行待ち</span></div><div id="results"></div></main>
<script>(()=>{'use strict';const ROOT='../';const DOMAIN_SETS=[
{id:'security',label:'情報セキュリティ',terms:'security-terms-manifest.json',details:'security-details-manifest.json',page:'html/security.html'},
{id:'network',label:'ネットワーク',terms:'network-terms-manifest.json',details:'network-details-manifest.json',page:'html/network.html'},
{id:'database',label:'データベース',terms:'database-terms-manifest.json',details:'database-details-manifest.json',page:'html/database.html'},
{id:'algorithm',label:'アルゴリズム',terms:'algorithm-terms-manifest.json',page:'html/algorithm.html',generatedDetails:true},
{id:'system',label:'システム開発',terms:'system-terms-manifest.json',page:'html/system.html',generatedDetails:true},
{id:'management',label:'プロジェクト管理',terms:'management-terms-manifest.json',page:'html/management.html',generatedDetails:true}
];const SMOKE=['index.html','html/test.html','html/security-past.html','js/shell.js','js/home.js','js/term-page.js','js/test.js','js/past.js','css/shell.css','css/home.css','css/term-page.css','css/test.css','css/past.css'];const results=[],root=document.getElementById('results'),summary=document.getElementById('summary');
async function response(path){const res=await fetch(ROOT+path,{cache:'no-store'});if(!res.ok)throw new Error(`${path}: HTTP ${res.status}`);return res}async function json(path){return (await response(path)).json()}function add(group,name,pass,detail=''){results.push({group,name,pass,detail})}function expected(m,key){const direct=Number(m?.meta?.[key]);return Number.isFinite(direct)&&direct>=0?direct:(m.files||[]).reduce((s,i)=>s+Number(i.count||0),0)}function same(a,b){const x=(a||[]).map(String).sort(),y=(b||[]).map(String).sort();return x.length===y.length&&x.every((v,i)=>v===y[i])}
async function checkDomain(set){const tm=await json(set.terms),termPayloads=await Promise.all((tm.files||[]).map(async item=>({item,payload:await json(item.file)}))),terms=termPayloads.flatMap(x=>x.payload.terms||[]);termPayloads.forEach(({item,payload})=>add(set.label,`${item.file} 件数`,Number(item.count||0)===(payload.terms||[]).length,`${payload.terms?.length||0}件`));add(set.label,'用語総数',terms.length===expected(tm,'totalTerms'),`${terms.length} / manifest ${expected(tm,'totalTerms')}`);const ids=terms.map(x=>x.id).filter(Boolean),names=terms.map(x=>x.term).filter(Boolean),categories=new Set((tm.categories||[]).map(x=>x.title));add(set.label,'用語ID重複なし',new Set(ids).size===ids.length,`${ids.length} IDs`);add(set.label,'用語名重複なし',new Set(names).size===names.length,`${names.length} terms`);add(set.label,'必須フィールド',terms.every(x=>x.id&&x.term&&x.category&&x.definition),'id / term / category / definition');add(set.label,'カテゴリ定義済み',terms.every(x=>categories.has(x.category)),'manifest categoriesと照合');await response(set.page);add(set.label,'学習ページ取得',true,set.page);
if(set.details){const dm=await json(set.details),detailPayloads=await Promise.all((dm.files||[]).map(async item=>({item,payload:await json(item.file)}))),details=detailPayloads.flatMap(x=>x.payload.details||[]);detailPayloads.forEach(({item,payload})=>add(set.label,`${item.file} 詳細件数`,Number(item.count||0)===(payload.details||[]).length,`${payload.details?.length||0}件`));add(set.label,'詳細総数',details.length===expected(dm,'totalDetails'),`${details.length} / manifest ${expected(dm,'totalDetails')}`);const tb=new Map(terms.map(x=>[x.id,x])),db=new Map(details.map(x=>[x.id,x]));add(set.label,'全用語に個別詳細あり',[...tb.keys()].every(id=>db.has(id)),`${db.size}件`);add(set.label,'孤立詳細なし',[...db.keys()].every(id=>tb.has(id)),'ID対応');const mismatch=[];for(const[id,t]of tb){const d=db.get(id);if(!d)continue;if(d.term&&d.term!==t.term)mismatch.push(`${id}:term`);if(d.category&&d.category!==t.category)mismatch.push(`${id}:category`)}add(set.label,'term/category対応',!mismatch.length,mismatch.slice(0,8).join(', ')||'OK')}else add(set.label,'詳細方式',Boolean(set.generatedDetails),'共通エンジン生成詳細');}
async function checkSmoke(){for(const path of SMOKE){try{await response(path);add('主要ファイル',path,true,'取得OK')}catch(e){add('主要ファイル',path,false,e.message)}}}
async function checkPast(){const index=await json('security-past-index.json');add('過去問','インデックス件数',Array.isArray(index.files)&&index.files.length>0,`${index.files?.length||0}件`);for(const item of index.files||[]){const[pastPayload,problemPayload]=await Promise.all([json(item.file),json(item.problemFile)]),past=pastPayload.pastQuestions||[],problem=problemPayload.problem||{};add('過去問',`${item.id}: 解説件数`,past.length===Number(item.count||0),`${past.length} / index ${item.count}`);add('過去問',`${item.id}: problemFile`,Boolean(problem.id),problem.id||'problem.idなし');for(const q of past){const sections=Array.isArray(q.sections)?q.sections:[],problemQuestions=Array.isArray(problem.questions)?problem.questions:[];add('過去問',`${q.id}: sectionsあり`,sections.length>0,`${sections.length}設問`);for(const section of sections){const hit=problemQuestions.find(question=>String(question.label||'')===String(section.label||''));add('過去問',`${q.id} ${section.label}: 問題側設問あり`,Boolean(hit),hit?'OK':'対応なし');if(hit)add('過去問',`${q.id} ${section.label}: targets一致`,same(section.answerTargets,hit.targets),`解説 [${(section.answerTargets||[]).join(', ')}] / 問題 [${(hit.targets||[]).join(', ')}]`);const answers=Array.isArray(section.expectedAnswers)?section.expectedAnswers:[];add('過去問',`${q.id} ${section.label}: 答案情報`,answers.length>0||section.status==='要原本確認',answers.length?`${answers.length}件`:`status=${section.status||'未設定'}`)}}}}
function render(){const failed=results.filter(x=>!x.pass).length,passed=results.length-failed;summary.innerHTML=`<span class="pill pass">PASS ${passed}</span><span class="pill ${failed?'fail':'pass'}">FAIL ${failed}</span><span class="pill">TOTAL ${results.length}</span>`;root.innerHTML=[...new Set(results.map(x=>x.group))].map(group=>`<section class="group"><h2>${group}</h2>${results.filter(x=>x.group===group).map(x=>`<div class="case"><span class="status ${x.pass?'pass':'fail'}">${x.pass?'PASS':'FAIL'}</span><div><strong>${x.name}</strong>${x.detail?`<div>${x.detail}</div>`:''}</div></div>`).join('')}</section>`).join('')}
async function run(){results.length=0;summary.innerHTML='<span class="pill">実行中...</span>';root.innerHTML='';try{for(const set of DOMAIN_SETS)await checkDomain(set);await checkSmoke();await checkPast()}catch(error){add('実行エラー','テスト処理',false,error.stack||error.message)}render()}document.getElementById('rerun').addEventListener('click',run);document.addEventListener('DOMContentLoaded',run)})();</script></body></html>
